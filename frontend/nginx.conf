# ═══════════════════════════════════════════════════════════════
# Nginx Configuration — Nexus Commerce Frontend
#
# Serves the React SPA with:
#   1. SPA routing fallback  — all paths → index.html
#   2. Gzip compression      — reduces bundle transfer size ~70%
#   3. Cache headers         — long-lived cache for hashed assets
#   4. Security headers      — basic hardening
# ═══════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ─── Gzip Compression ──────────────────────────────────────
    # Compresses text-based responses before sending.
    # Modern JS bundles compress ~70% — a 500KB bundle becomes ~150KB.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff
        font/woff2;

    # ─── SPA Routing Fallback ───────────────────────────────────
    # React Router handles routing client-side.
    # Without this, navigating to /dashboard directly returns 404
    # because Nginx looks for a file at /dashboard (which doesn't exist).
    # try_files serves the file if it exists, otherwise falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── Static Asset Caching ───────────────────────────────────
    # Vite adds content hashes to all asset filenames (e.g., main.a1b2c3d4.js).
    # Since the filename changes when the content changes, we can safely
    # cache these files for 1 year (immutable = browser never revalidates).
    location ~* \.(js|css|woff|woff2|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off; # Don't log static asset requests
    }

    # ─── index.html — No Cache ──────────────────────────────────
    # index.html must NOT be cached — it's the entry point that loads
    # the hashed JS/CSS. If it's stale, users get the old bundle even
    # after a new deployment.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ─── Security Headers ────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── Error Pages ─────────────────────────────────────────────
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}
