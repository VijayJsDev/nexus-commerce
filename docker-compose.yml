services:
  # ─── PostgreSQL Database ────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: saas_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-saas_commerce}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Node.js / Express Backend ──────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saas_backend
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-saas_commerce}?schema=public
      - PORT=5000
      - NODE_ENV=development
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    restart: unless-stopped

  # ─── React / Vite Frontend ──────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      # "development" target uses Vite dev server with HMR.
      # For production: change target to "production" (Nginx static serving).
      target: development
    container_name: saas_frontend
    ports:
      # Host 3000 → Container 3000 (Vite dev server)
      - "3000:3000"
    environment:
      # Backend URL inside Docker network (service name as hostname)
      - VITE_API_URL=http://backend:5000
      - VITE_APP_NAME=Nexus Commerce
    volumes:
      # Mount source for hot-module replacement (file changes reflect instantly)
      - ./frontend:/app
      # Anonymous volume: preserves container's node_modules.
      # Without this, the host's node_modules (Windows) would override
      # the container's (Linux), causing binary incompatibility errors.
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
