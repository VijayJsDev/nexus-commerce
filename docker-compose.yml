services:
  # ─── PostgreSQL Database ────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: saas_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-saas_commerce}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── .NET 10 / ASP.NET Core Backend ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saas_backend
    ports:
      # Host 5000 → Container 8080 (ASP.NET Core default port inside Docker)
      - "5000:8080"
    environment:
      # Override the environment to Development so appsettings.Development.json is loaded
      - ASPNETCORE_ENVIRONMENT=Development
      # Connection string — overrides the value in appsettings.Development.json
      # "postgres" below is the Docker service name, used as hostname inside the network
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-saas_commerce};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-password}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ─── React / Vite Frontend ──────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      # "development" target uses Vite dev server with HMR.
      # For production: change target to "production" (Nginx static serving).
      target: development
    container_name: saas_frontend
    ports:
      # Host 3000 → Container 3000 (Vite dev server)
      - "3000:3000"
    environment:
      # Backend URL inside Docker network (service name as hostname)
      - VITE_API_URL=http://backend:8080
      - VITE_APP_NAME=Nexus Commerce
    volumes:
      # Mount source for hot-module replacement (file changes reflect instantly)
      - ./frontend:/app
      # Anonymous volume: preserves container's node_modules.
      # Without this, the host's node_modules (Windows) would override
      # the container's (Linux), causing binary incompatibility errors.
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
